services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    volumes:
      - shop-data:/app/data
  frontend:
    image: node:20-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./:/web
      - frontend-node-modules:/web/node_modules
volumes:
  shop-data:
  frontend-node-modules:
